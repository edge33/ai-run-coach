name: Verify
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: running-data-hub-validation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - name: Prepare bind-mounted data directory
        env:
          DATA_PATH: ${{ runner.temp }}/running-data-hub-validation-data
        run: |
          echo "DATA_PATH=$DATA_PATH" >> "$GITHUB_ENV"
          sudo install -d -m 0755 -o 1000 -g 1000 "$DATA_PATH"
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
        env:
          APP_ORIGINS: http://127.0.0.1:8080
      - run: docker compose exec nginx nginx -t
      - if: always()
        run: docker compose logs && docker compose down -v
