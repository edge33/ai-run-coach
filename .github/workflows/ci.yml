name: Verify
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: running-data-hub-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: docker compose config --quiet
        env:
          TAILSCALE_IP: 127.0.0.1
      - run: docker compose up --build -d --wait
        env:
          TAILSCALE_IP: 127.0.0.1
          APP_ORIGINS: http://127.0.0.1:8080
      - run: docker compose exec nginx nginx -t
        env:
          TAILSCALE_IP: 127.0.0.1
      - run: node scripts/compose-smoke.mjs
      - run: node scripts/compose-lifecycle.mjs
      - if: always()
        run: docker compose logs && docker compose down -v
        env:
          TAILSCALE_IP: 127.0.0.1
