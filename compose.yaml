name: running-data-hub
x-runtime: &runtime
  image: running-data-hub:local
  build:
    context: .
    target: runtime
  init: true
  restart: unless-stopped
  environment: &environment
    SQLITE_PATH: /app/data/db/coach.sqlite
    WIKI_PATH: /app/athlete_wiki
    ATHLETE_TIMEZONE: ${ATHLETE_TIMEZONE:-Europe/Rome}
    APP_ORIGINS: ${APP_ORIGINS:-http://${TAILSCALE_IP:?Set TAILSCALE_IP to the host Tailscale address}:8080}
  networks: [hub]

services:
  migrate:
    <<: *runtime
    restart: "no"
    command: [node, apps/api/src/cli.ts, migrate]
    volumes:
      - database:/app/data/db

  api:
    <<: *runtime
    command: [node, apps/api/src/server.ts]
    environment:
      <<: *environment
      INTERVALS_API_KEY: ${INTERVALS_API_KEY:-}
      INTERVALS_ATHLETE_ID: ${INTERVALS_ATHLETE_ID:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - database:/app/data/db
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s

  mcp:
    <<: *runtime
    command: [node, apps/mcp/src/http.ts]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - database:/app/data/db
      - wiki:/app/athlete_wiki
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  nginx:
    build:
      context: .
      target: proxy
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:?Set TAILSCALE_IP to the host Tailscale address}:8080:8080"
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    networks: [hub]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/proxy-health"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  hub:
volumes:
  database:
  wiki:
