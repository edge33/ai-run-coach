name: running-data-hub
x-runtime: &runtime
  image: running-data-hub:local
  build:
    context: .
    target: runtime
  init: true
  restart: unless-stopped
  environment: &environment
    WIKI_PATH: /app/athlete_wiki
    APP_ORIGINS: ${APP_ORIGINS:-http://${BIND_IP:-127.0.0.1}:8080}
  networks: [hub]

services:
  api:
    <<: *runtime
    command: [node, apps/api/src/server.ts]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s

  mcp:
    <<: *runtime
    command: [node, apps/mcp/src/http.ts]
    volumes:
      - wiki:/app/athlete_wiki
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  nginx:
    build:
      context: .
      target: proxy
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8080:8080"
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    networks: [hub]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/proxy-health"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  hub:
volumes:
  wiki:
