name: running-data-hub
x-runtime: &runtime
  image: running-data-hub:local
  build:
    context: .
    target: runtime
  init: true
  restart: unless-stopped
  environment: &environment
    SQLITE_PATH: /app/data/db/coach.sqlite
    WIKI_PATH: /app/data/athlete_wiki
    LOG_LEVEL: ${LOG_LEVEL:-info}
    GARMIN_REQUEST_INTERVAL_MS: ${GARMIN_REQUEST_INTERVAL_MS:-1000}
    ATHLETE_TIMEZONE: ${ATHLETE_TIMEZONE:-Europe/Rome}
    APP_ORIGINS: ${APP_ORIGINS:-http://${BIND_IP:-127.0.0.1}:8080}
  networks: [hub]

services:
  initialize:
    <<: *runtime
    restart: "no"
    command: [node, scripts/initialize.ts]
    volumes:
      - ${DATA_PATH:-./data}:/app/data

  api:
    <<: *runtime
    command: [node, apps/api/src/server.ts]
    environment:
      <<: *environment
      GARMIN_API_KEY: ${GARMIN_API_KEY:-}
    depends_on:
      initialize:
        condition: service_completed_successfully
    volumes:
      - ${DATA_PATH:-./data}:/app/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s

  mcp:
    <<: *runtime
    command: [node, apps/mcp/src/http.ts]
    depends_on:
      initialize:
        condition: service_completed_successfully
    volumes:
      - ${DATA_PATH:-./data}:/app/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  nginx:
    build:
      context: .
      target: proxy
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8080:8080"
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    networks: [hub]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/proxy-health"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  hub:
